<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>太阳系空间图 · SOLAR SYSTEM ATLAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#050608;--line:rgba(255,236,210,.12);--line2:rgba(255,236,210,.22);--txt:#ece6da;--dim:#8f897e;--acc:#f0b56a;--mono:'JetBrains Mono',ui-monospace,monospace;--serif:'Songti SC','STSong','Noto Serif CJK SC','Source Han Serif SC','SimSun',serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#c:active{cursor:grabbing}
.hud{position:fixed;pointer-events:none;z-index:2}
.hud *{pointer-events:auto}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.chip{font-size:10px;letter-spacing:.08em;padding:5px 10px;border:1px solid var(--line2);border-radius:20px;background:rgba(20,18,16,.55);backdrop-filter:blur(6px);color:var(--dim);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.chip:hover{color:var(--txt);border-color:rgba(255,236,210,.4)}
.chip.on{color:var(--txt);border-color:var(--acc);background:rgba(240,181,106,.12)}
.chip.lang{color:var(--txt);border-color:rgba(255,236,210,.45)}
.chip.lang b{color:var(--acc);font-weight:600}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
#top{top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{display:flex;flex-direction:column;gap:4px}
.brand b{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.12em}
.brand span{font-size:9px;color:var(--dim);letter-spacing:.3em}
.brand .by{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.12em;color:var(--acc);display:inline-flex;align-items:center;gap:10px;margin-bottom:6px;text-shadow:0 0 18px rgba(240,181,106,.35)}
.brand .by:before{content:'';width:26px;height:2px;background:var(--acc)}
#filters{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:700px}
#holo{top:130px;left:22px;font-size:9px;color:var(--dim);letter-spacing:.14em;line-height:1.8}
#holo b{color:var(--txt);font-weight:600;letter-spacing:.2em;display:block;font-size:10px}
#holo .v{color:var(--acc)}
#panel{top:84px;right:18px;width:340px;max-height:calc(100vh - 210px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:rgba(14,13,12,.62);backdrop-filter:blur(14px);overflow:hidden}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;padding:11px 0;font-size:11px;letter-spacing:.14em;color:var(--dim);border-bottom:2px solid transparent}
#tabs button.on{color:var(--txt);border-bottom-color:var(--acc)}
#pbody{overflow-y:auto;padding:18px;scrollbar-width:thin;scrollbar-color:#3a352f transparent}
.h1{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.04em;line-height:1.25}
.sub{font-size:9px;letter-spacing:.3em;color:var(--dim);margin:6px 0 14px}
.tag{display:inline-block;font-size:9px;letter-spacing:.12em;padding:3px 8px;border-radius:10px;border:1px solid var(--line2);margin:0 4px 6px 0;color:var(--dim)}
.p{font-family:var(--serif);font-size:13px;line-height:1.85;color:#d6cfc3;margin:10px 0 14px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:rgba(255,255,255,.015)}
.card h4{font-size:9px;letter-spacing:.24em;color:var(--dim);font-weight:400;margin-bottom:8px}
.row{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px dashed rgba(255,236,210,.06);gap:12px}
.row:last-child{border:none}
.row span:first-child{color:var(--dim);white-space:nowrap}
.row span:last-child{text-align:right}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 6px;border-radius:8px;font-size:11px}
.li:hover,.li.on{background:rgba(255,236,210,.06)}
.li i{width:8px;height:8px;border-radius:50%;flex:none}
.li i.x{background:none!important;border:1.5px solid}
.li .y{margin-left:auto;color:var(--dim);font-size:10px}
.grp{font-size:9px;letter-spacing:.24em;color:var(--dim);margin:14px 0 4px}
.back{font-size:10px;color:var(--dim);letter-spacing:.1em;margin-bottom:10px}
.back:hover{color:var(--txt)}
#tl{left:18px;right:376px;bottom:16px;height:96px;border:1px solid var(--line);border-radius:14px;background:rgba(14,13,12,.55);backdrop-filter:blur(10px);padding:12px 16px}
#tlhead{display:flex;gap:18px;align-items:baseline;font-size:9px;color:var(--dim);letter-spacing:.14em}
#tlhead b{font-size:22px;color:var(--txt);font-weight:300;letter-spacing:.06em}
#tlhead em{font-style:normal;color:var(--txt);font-size:12px;margin-right:4px}
#tlaxis{position:relative;height:40px;margin-top:8px}
#tlaxis .ax{position:absolute;left:0;right:0;top:20px;height:1px;background:var(--line2)}
#tlaxis .yr{position:absolute;top:26px;font-size:8px;color:var(--dim);transform:translateX(-50%)}
#tlaxis .d{position:absolute;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;transition:transform .15s}
#tlaxis .d:hover,#tlaxis .d.on{transform:translate(-50%,-50%) scale(1.7)}
#tlaxis .d.x{background:transparent!important;border:1.5px solid}
#tlaxis .d.f{background:transparent!important;border:1.5px dashed}
#tlaxis .now{position:absolute;top:2px;bottom:6px;width:1px;background:var(--acc)}
#tip{position:fixed;z-index:5;pointer-events:none;font-size:10px;background:rgba(14,13,12,.9);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;display:none;white-space:nowrap}
.lbl{position:fixed;z-index:1;pointer-events:none;font-size:9px;letter-spacing:.12em;color:#efe6d6;white-space:nowrap;transform:translate(10px,-50%);text-shadow:0 0 6px #000,0 0 2px #000}
.lbl small{display:block;color:var(--dim);font-size:8px}
#hint{bottom:124px;left:22px;font-size:9px;color:var(--dim);letter-spacing:.14em}
#zoom{right:376px;bottom:124px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:rgba(20,18,16,.6);backdrop-filter:blur(6px);color:var(--txt);font-size:15px;line-height:1}
#zoom button:active{border-color:var(--acc)}
#fold{display:none;flex:0 0 44px!important;font-size:13px!important;transition:transform .25s}
body.fold #fold{transform:rotate(180deg)}
@media (max-height:520px) and (min-width:600px){
 #tl{display:none!important}
 #top{right:330px;top:8px}
 .brand b{font-size:15px}
 .brand>span:not(.by){display:none}
 #panel{top:10px!important;bottom:10px!important;left:auto!important;right:10px!important;width:300px!important;max-height:none!important}
 body.fold #panel{max-height:46px!important;bottom:auto!important}
 #zoom,body.fold #zoom{bottom:12px!important;left:12px}
 #filters{position:fixed;left:122px;right:320px;bottom:16px;flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none}
 #filters::-webkit-scrollbar{display:none}
}
#loader{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:var(--bg);font-size:10px;letter-spacing:.3em;color:var(--dim);transition:opacity .8s}
#loader i{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:ld 1.2s infinite}
@keyframes ld{0%{transform:scaleX(.2)}50%{transform:scaleX(1)}100%{transform:scaleX(.2)}}
@media (max-width:820px),(max-height:520px){
 #top{top:10px;left:12px;right:12px;flex-direction:column;gap:8px}
 .brand b{font-size:17px}
 .brand .by{font-size:15px;margin-bottom:2px}
 #filters{justify-content:flex-start;flex-wrap:wrap;max-width:100%;gap:5px}
 #filters .chip{font-size:9px;padding:4px 8px;letter-spacing:.04em}
 #filters::-webkit-scrollbar{display:none}
 #holo{display:none}
 #panel{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:40vh;max-height:40dvh}
 #tl{left:10px;right:10px;bottom:calc(40vh + 18px);bottom:calc(40dvh + 18px);height:62px;padding:8px 12px}
 #tlhead{display:none}
 #tlaxis{margin-top:0}
 #hint{display:none}
 .lbl{display:none}
 #fold{display:block}
 #zoom{flex-direction:row;left:12px;right:auto;top:auto;bottom:calc(40vh + 90px);bottom:calc(40dvh + 90px)}
 #zoom button{width:30px;height:30px;font-size:13px}
 body.fold #zoom{bottom:138px}
 body.fold #panel{max-height:46px}
 body.fold #pbody{display:none}
 body.fold #tl{bottom:64px}
}
#bodies{display:inline-flex;gap:2px;margin-top:10px;padding:3px;border:1px solid var(--line2);border-radius:22px;background:rgba(20,18,16,.6);backdrop-filter:blur(8px);width:max-content}
#bodies button{padding:7px 16px;border-radius:18px;font-size:12px;letter-spacing:.08em;color:var(--dim);transition:.25s;font-family:var(--mono)}
#bodies button.on{background:rgba(240,181,106,.18);color:var(--txt);box-shadow:inset 0 0 0 1px rgba(240,181,106,.6)}
#bodies button:disabled{opacity:.45;cursor:wait}
body[data-view=earth] #tl,body[data-view=sun] #tl{display:none}
body[data-view=sun] #hint{bottom:20px}
.lbl.cmp{font-size:9px;color:#ffe2b8;letter-spacing:.14em;transform:translate(0,-50%)}
body[data-view=earth] #hint{bottom:20px}
#holo{top:272px}
#sysmap{display:block;margin-top:8px;margin-left:-6px;touch-action:none}
#sysTip{font-size:9px;letter-spacing:.14em;color:var(--acc);height:14px;margin-top:1px;white-space:nowrap}
@media (max-width:820px),(max-height:520px){#bodies{margin-top:6px}#bodies button{padding:6px 14px;font-size:11px}body[data-view=earth] #zoom,body[data-view=sun] #zoom{bottom:calc(40vh + 22px);bottom:calc(40dvh + 22px)}body[data-view=earth].fold #zoom,body[data-view=sun].fold #zoom{bottom:72px}}
.ripple{position:fixed;z-index:4;pointer-events:none;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid currentColor;border-radius:50%;box-shadow:0 0 12px currentColor,inset 0 0 8px currentColor;opacity:0;animation:rp .85s cubic-bezier(.15,.7,.3,1) forwards}
.ripple.big{animation:rpb 1.2s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes rp{0%{transform:scale(.3);opacity:1}100%{transform:scale(4.6);opacity:0}}
@keyframes rpb{0%{transform:scale(.4);opacity:1}100%{transform:scale(9);opacity:0}}
.lbl.far{color:#d8ecff;font-size:10px;letter-spacing:.16em;transition:transform .2s}
.lbl.far small{color:var(--acc);font-size:8px}
.lbl.far.hot{transform:translate(14px,-50%) scale(1.08)}
</style>
</head>
<body data-view="moon">
<div id="loader"><span id="ldTxt">正在进入太阳系 · LOADING</span><i></i></div>
<script>
window.__err=function(m){var l=document.getElementById('loader');if(l)l.innerHTML='<span style="max-width:320px;text-align:center;line-height:2;letter-spacing:.05em;padding:0 20px">加载出错，请截图发给作者<br>Loading failed — please send a screenshot<br><small style="color:#f0b56a;word-break:break-all;letter-spacing:0">'+m+'</small><br><button onclick="location.reload()" style="margin-top:14px;padding:6px 16px;border:1px solid #f0b56a;border-radius:20px;color:#f0b56a;background:none">重新加载 Reload</button></span>'};
window.addEventListener('error',function(e){if(e.message)__err(e.message+' @'+String(e.filename||'').split('/').pop()+':'+(e.lineno||''))});
window.addEventListener('unhandledrejection',function(e){__err('Promise: '+(e.reason&&e.reason.message||e.reason))});
setTimeout(function(){if(document.getElementById('loader'))__err('timeout · stage='+(window.__stage||'no-js（app.js 没有运行）')+' · '+navigator.userAgent.slice(0,80))},40000);
</script>
<canvas id="c"></canvas>

<div class="hud" id="top">
  <div class="brand"><span class="by" id="tBy">创建人：Yuan Jiahao</span><b id="tTitle">太阳系空间图</b><span id="tSub">SOLAR SYSTEM ATLAS</span><canvas id="sysmap"></canvas><div id="sysTip"></div></div>
  <div id="filters"></div>
</div>
<div class="hud" id="holo">
  <b>HOLOGRAPHIC ANALYSIS</b>
  <span id="tHolo">月面坐标 · SELENOGRAPHIC</span><br>
  LAT <span class="v" id="hLat">--</span> &nbsp; LON <span class="v" id="hLon">--</span><br>
  <span id="tDist">观测距离</span> <span class="v" id="hDist">--</span> km<br>
  <span id="hSite"></span>
</div>
<div class="hud" id="hint"></div>

<div class="hud" id="panel">
  <div id="tabs"><button data-t="moon" class="on"></button><button data-t="land"></button><button data-t="sat"></button><button id="fold" aria-label="fold">▾</button></div>
  <div id="pbody"></div>
</div>

<div class="hud" id="tl">
  <div id="tlhead"><b>2026</b><span><em id="nLand">0</em><span id="tL1"></span></span><span><em>12</em><span id="tL2"></span></span><span><em>5</em><span id="tL3"></span></span><span><em id="nSat">0</em><span id="tL4"></span></span></div>
  <div id="tlaxis"><div class="ax"></div></div>
</div>
<div id="tip"></div>
<div class="hud" id="zoom"><button data-z="0.8">＋</button><button data-z="1.25">－</button><button data-z="r" title="reset">◎</button></div>

<script src="app.js" onerror="__err('app.js 文件加载失败：网站里缺少 app.js，请把 solar-atlas 文件夹里的全部文件重新上传 · app.js missing')"></script>
</body>
</html>
